# ============================================================
# ZiZu Backend - Python 项目配置
# uv / pip 可直接使用
# ============================================================

[project]
name = "zizu-backend"
version = "0.4.50"
description = "ZiZu IoT Platform - 替代 ThingsBoard 的工业 IoT 开发平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # --- 数据库 ---
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",           # 异步 PG 驱动 (FastAPI 用)
    "psycopg2-binary>=2.9.9",    # 同步 PG 驱动 (批量写入/迁移用)
    "alembic>=1.13.0",

    # --- 数据处理 ---
    "pint>=0.23",                 # 单位换算 (归一化器 M3)
    "sympy>=1.13",                # 符号公式求值 (虚拟点位引擎 M5)
    "pandas>=2.2",                # 聚合后处理 (查询 API)

    # --- MQTT ---
    "paho-mqtt>=2.1.0",           # MQTT 客户端 (M2 接入层)

    # --- 规则引擎 ---
    "zen-engine>=0.53.0",          # GoRules ZEN 引擎 (M6)

    # --- 控制 ---
    "httpx>=0.27.0",              # 异步 HTTP (M7 RPC Neuron REST API)
    "tenacity>=9.0.0",            # 重试策略 (M7 JWT 刷新)
    "python-jose[cryptography]>=3.3.0",   # JWT (M7 权限校验)
    "passlib[bcrypt]>=1.7.4",     # 密码哈希

    # --- 定时任务 ---
    "apscheduler[asyncio,timezone]>=3.10.4",  # 任务调度 (M8)

    # --- 工具 ---
    "loguru>=0.7.2",              # 结构化日志
    "pydantic-settings>=2.5.0",   # 配置管理
    "python-multipart>=0.0.12",   # 文件上传支持
    "pyyaml>=6.0.2",              # 节点树 YAML 导入导出 (M1 F3)
]

[project.optional-dependencies]



