# ============================================================
# ZiZu IoT Platform - Docker Compose (全栈一键部署)
#
# 三服务: TimescaleDB + FastAPI(Backend+Frontend SPA) + NanoMQ
#
# 快速启动:
#   python scripts/bootstrap_runtime_secrets.py
#   docker compose up -d --build
#
# 访问:
#   http://localhost:9000          → 前端页面
#   http://localhost:9000/api/docs → API 文档
#
# e606 内核裁剪版 (5.10.160) 特殊配置:
#   1. 无法 docker build → 使用预构建镜像: docker compose up -d
#   2. 需添加 tmpfs: - /dev/mqueue (内核无 CONFIG_POSIX_MQUEUE)
#   3. 需改为 network_mode: host (内核无 CONFIG_VETH)
#   见 docs/deploy-e606.md
# ============================================================

services:
  # ══════════════════════════════════════════
  # TimescaleDB (时序 + 关系数据库) @5432
  # ══════════════════════════════════════════
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: zizu-tsdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-zizu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run python scripts/bootstrap_runtime_secrets.py first}
      POSTGRES_DB: ${DB_NAME:-zizu}
      TIMESCALEDB_TELEMETRY: 'off'
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zizu} -d ${DB_NAME:-zizu} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ══════════════════════════════════════════
  # NanoMQ (MQTT Broker) @1883
  # ══════════════════════════════════════════
  nanomq:
    image: emqx/nanomq:latest
    container_name: zizu-nanomq
    restart: unless-stopped
    environment:
      NANOMQ_CONF_PATH: /run/secrets/nanomq.conf
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "8084:8084"
      - "8081:8081"
    volumes:
      - ./config/nanomq.conf:/usr/local/nanomq/nanomq.conf:ro
      - nanomq_data:/usr/local/nanomq/data
    secrets:
      - source: nanomq_http_config
        target: nanomq.conf
    healthcheck:
      test: ["CMD-SHELL", "nanomq_cli dscv | grep -q . || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ══════════════════════════════════════════
  # FastAPI Backend + Frontend SPA @9000
  #
  # 构建: docker compose up -d --build
  # 预构建镜像: docker compose up -d (e606 等无法 build 的环境)
  # ══════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: zizu:0.1.0
    container_name: zizu
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      # Docker Compose 内部服务名解析
      DB_HOST: timescaledb
      DB_PORT: 5432
      MQTT_HOST: nanomq
      MQTT_PORT: 1883
      FRONTEND_DIST: /app/frontend/dist
    volumes:
      - zizu-data:/app/data
      - ./init-db:/app/init-db:ro
      # nanoMQ 配置管理：后端可读写 nanoMQ 配置并重启容器
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app
    depends_on:
      timescaledb:
        condition: service_healthy
      nanomq:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-9000}/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  tsdb_data:
  nanomq_data:
  zizu-data:

secrets:
  nanomq_http_config:
    file: ./config/runtime/nanomq.conf
