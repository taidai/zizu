name: Build immutable release images

on:
  workflow_dispatch:
    inputs:
      platform_version:
        description: ZiZu platform version to publish
        required: true
        type: string
      edge_proxy_image:
        description: Pre-reviewed edge proxy image, pinned by digest
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build amd64 and arm64 release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable images
        run: >-
          python scripts/build_release_images.py
          --repository ghcr.io/${{ github.repository }}
          --platform-version "${{ inputs.platform_version }}"
          --edge-proxy-image "${{ inputs.edge_proxy_image }}"
          --output release.json

      - name: Validate release manifest
        run: >-
          python scripts/release_preflight.py verify
          --release release.json
          --migrations-dir init-db

      - name: Preserve immutable release manifest
        uses: actions/upload-artifact@v4
        with:
          name: zizu-release-${{ inputs.platform_version }}
          path: release.json
          retention-days: 90
