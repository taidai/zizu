# NanoMQ Configuration (HOCON format) — ZiZu e606
# 启用 REST API 管理接口，供 ZiZu 管理界面调用

mqtt {
    max_packet_size = 256MB
    max_mqueue_len = 2048
}

# REST API 管理接口（为 ZiZu 管理界面提供）
# 如需禁用，可注释掉本段并重启 nanoMQ
http_server {
    include "/run/secrets/nanomq-http.conf"
    port = 8081
    limit_conn = 256
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

listeners.ws {
    bind = "0.0.0.0:8084"
}

sqlite {
    enable = true
    disk_cache_size = 102400
    flushed_mem_threshold = 100
    max_file_size = 204800
}

log {
    to = file
    level = info
    dir = "/tmp"
    file = "nanomq.log"
}
